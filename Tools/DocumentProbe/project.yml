name: DocumentProbe
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  DocumentProbe:
    type: application
    platform: iOS
    sources: [Probe]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.local.mila-document-probe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  ProbeTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ProbeTests]
    dependencies:
      - target: DocumentProbe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DocumentProbe:
    build:
      targets:
        DocumentProbe: all
    test:
      targets: [ProbeTests]
